<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALACTIC COOKIE — Sauvegardes</title>
<link rel="icon" type="image/svg+xml" href="fav-icon.svg">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ==================== BASE ==================== */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1a0f2e, #000);
    font-family: 'Exo 2', sans-serif;
    color: white;
    overflow: hidden;
}

/* ==================== SAVE SELECT ==================== */
#saveSelect {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1a0f2e, #000);
}

/* ==================== SAVE BOX ==================== */
.save-box {
    background: rgba(10,10,26,0.95);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 18px;
    padding: 30px;
    width: 420px;
    box-shadow: 0 0 50px rgba(255,215,0,0.35);
}

/* ==================== TITRE ==================== */
.save-title {
    font-family: 'Orbitron', monospace;
    color: gold;
    text-align: center;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

/* ==================== SLOT ==================== */
.save-slot {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    transition: all 0.25s;
}

.save-slot:hover {
    border-color: gold;
    box-shadow: 0 0 20px rgba(255,215,0,0.25);
}

.save-slot b {
    color: gold;
    font-size: 1.05rem;
}

/* ==================== META ==================== */
.save-meta {
    font-size: 0.75rem;
    opacity: 0.6;
    margin-top: 4px;
}

/* ==================== ACTIONS ==================== */
.save-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.save-actions button {
    flex: 1;
    background: rgba(255,215,0,0.15);
    border: 1px solid rgba(255,215,0,0.4);
    color: gold;
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
}

.save-actions button:hover {
    background: rgba(255,215,0,0.3);
}

/* ==================== DELETE ==================== */
.delete-btn {
    background: rgba(255,50,50,0.15);
    border-color: rgba(255,50,50,0.5);
    color: #ff6666;
}

.delete-btn:hover {
    background: rgba(255,50,50,0.3);
}

/* ==================== EXTRA META ==================== */
.save-extra {
    font-size: 0.7rem;
    opacity: 0.45;
    margin-top: 5px;
}
</style>
</head>

<body>

<div id="saveSelect">
    <div class="save-box">
        <div class="save-title">CHOISIR UNE SAUVEGARDE</div>

        <div class="save-slot">
            <b>Slot 1</b>
            <div class="save-meta" id="slotMeta1">Vide</div>
            <div class="save-actions">
                <button onclick="playSlot(1)">Jouer</button>
                <button class="delete-btn" onclick="deleteSlot(1)">Supprimer</button>
            </div>
        </div>

        <div class="save-slot">
            <b>Slot 2</b>
            <div class="save-meta" id="slotMeta2">Vide</div>
            <div class="save-actions">
                <button onclick="playSlot(2)">Jouer</button>
                <button class="delete-btn" onclick="deleteSlot(2)">Supprimer</button>
            </div>
        </div>

        <div class="save-slot">
            <b>Slot 3</b>
            <div class="save-meta" id="slotMeta3">Vide</div>
            <div class="save-actions">
                <button onclick="playSlot(3)">Jouer</button>
                <button class="delete-btn" onclick="deleteSlot(3)">Supprimer</button>
            </div>
        </div>
    </div>
</div>

<script>
const SAVE_PREFIX = "galactic_cookie_save_slot_";

function timeAgo(ms) {
    const sec = Math.floor(ms / 1000);
    if (sec < 60) return `${sec}s`;
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min} min`;
    const h = Math.floor(min / 60);
    if (h < 24) return `${h} h`;
    const d = Math.floor(h / 24);
    return `${d} j`;
}

function updateSlots() {
    for (let i = 1; i <= 3; i++) {
        const data = localStorage.getItem(SAVE_PREFIX + i);
        const meta = document.getElementById("slotMeta" + i);

        if (!data) {
            meta.textContent = "Nouvelle partie";
            continue;
        }

        try {
            const save = JSON.parse(data);

            // 🍪 TOTAL AFFICHÉ
            let biscuits =
                save.totalEarned ??
                save.score ??
                save.cookies ??
                0;

            const prestige = save.prestige ?? 0;

            let offlineLine = "";
            let timeLine = "";

            // 💤 OFFLINE PREVIEW
            if (save.savedAt && save.cps && save.prestigeBonus) {
                const elapsed = Math.min(
                    (Date.now() - save.savedAt) / 1000,
                    3600
                );
                const offline =
                    elapsed * save.cps * save.prestigeBonus;

                if (offline > 1) {
                    offlineLine =
                        `<div class="save-extra">💤 +${Math.floor(offline)} biscuits hors-ligne</div>`;
                    biscuits += offline;
                }

                timeLine =
                    `<div class="save-extra">🕒 Dernière session : il y a ${timeAgo(Date.now() - save.savedAt)}</div>`;
            }

            meta.innerHTML = `<span>
                ${Math.floor(biscuits)} biscuits — Prestige ${prestige} </span>
                ${offlineLine}
                ${timeLine}
            `;
        } catch (e) {
            meta.textContent = "Données corrompues";
        }
    }
}

function playSlot(slot) {
    localStorage.setItem("galactic_cookie_active_slot", slot);
    window.location.href = 'game.html?slot=' + slot;
}

function deleteSlot(slot) {
    if (!confirm("⚠️ Supprimer définitivement cette sauvegarde ?")) return;

    const key = SAVE_PREFIX + slot;

    // 1. Supprimer du LocalStorage
    localStorage.removeItem(key);

    // 2. Supprimer le Cookie (très important car ton code de chargement vérifie peut-être les deux)
    document.cookie = `${key}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;

    // 3. Si c'était le slot actif, on le retire
    if (localStorage.getItem("galactic_cookie_active_slot") == slot) {
        localStorage.removeItem("galactic_cookie_active_slot");
    }

    console.log(`Slot ${slot} totalement effacé.`);
    updateSlots();
}

updateSlots();
</script>

</body>
</html>
