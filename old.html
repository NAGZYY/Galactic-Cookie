<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f3f3f3;
            margin: 0;
            padding: 0;
        }

        .cookie {
            margin: 50px auto;
            width: 200px;
            height: 200px;
            background-color: #d2691e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .cookie p {
            color: white;
            font-size: 18px;
            margin: 0;
        }

        .score {
            font-size: 24px;
            margin: 20px 0;
        }

        .shop {
            margin: 20px auto;
            max-width: 400px;
            text-align: left;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .shop h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .shop button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #008cba;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .shop button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="cookie" onclick="incrementScore()">
        <p>🍪</p>
    </div>
    <div class="score">
        Score: <span id="score">0</span>
    </div>
    <div class="shop">
        <h2>Boutique</h2>
        <button id="bonusButton" onclick="buyBonus()">Acheter un bonus (Prix: <span id="bonusPrice">10</span>)</button>
        <button id="autoclickerButton" onclick="buyAutoClicker()">Acheter un auto-clicker (Prix: <span id="autoclickerPrice">50</span>)</button>
    </div>

    <script>
        let score = 0;
        let bonus = 1;
        let bonusPrice = 10;
        let autoClickerPrice = 50;
        let autoClickerInterval;

        const scoreElement = document.getElementById('score');
        const bonusPriceElement = document.getElementById('bonusPrice');
        const autoclickerPriceElement = document.getElementById('autoclickerPrice');

        function incrementScore() {
            score += bonus;
            updateScoreDisplay();
        }

        function buyBonus() {
            if (score >= bonusPrice) {
                score -= bonusPrice;
                bonus++;
                bonusPrice = Math.ceil(bonusPrice * 1.5);
                bonusPriceElement.textContent = bonusPrice;
                updateScoreDisplay();
            }
        }

        function buyAutoClicker() {
            if (score >= autoClickerPrice) {
                score -= autoClickerPrice;
                autoClickerPrice = Math.ceil(autoClickerPrice * 1.5);
                autoclickerPriceElement.textContent = autoClickerPrice;
                updateScoreDisplay();

                if (!autoClickerInterval) {
                    autoClickerInterval = setInterval(() => {
                        incrementScore();
                    }, 1000);
                }
            }
        }

        function updateScoreDisplay() {
            scoreElement.textContent = score;
            document.getElementById('bonusButton').disabled = score < bonusPrice;
            document.getElementById('autoclickerButton').disabled = score < autoClickerPrice;
        }

        updateScoreDisplay();
    </script>
</body>
</html>
