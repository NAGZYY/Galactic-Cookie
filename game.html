<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALACTIC COOKIE — Biscuit de l'Univers</title>
    <link rel="icon" type="image/svg+xml" href="fav-icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --orange: #FF6B35;
            --deep: #0a0a1a;
            --panel: rgba(255,255,255,0.04);
            --border: rgba(255,215,0,0.15);
            --glow: 0 0 30px rgba(255,107,53,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--deep);
            color: #e0d8c8;
            cursor: none;
        }

        /* Starfield */
        #stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--d) ease-in-out infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.1; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

        /* Custom cursor */
        #cursor {
            position: fixed;
            width: 28px; height: 28px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease, background 0.2s;
            mix-blend-mode: screen;
        }
        #cursor.clicking { transform: translate(-50%, -50%) scale(0.6); background: rgba(255,215,0,0.3); }

        /* Layout */
        .game-wrapper {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 260px 1fr 280px;
            grid-template-rows: auto 1fr;
            height: 100vh;
            overflow: hidden;
            gap: 0;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            padding: 18px 30px;
            background: linear-gradient(135deg, rgba(10,10,26,0.95), rgba(20,10,30,0.95));
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }
        .logo {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.4rem;
            background: linear-gradient(90deg, var(--gold), var(--orange), var(--gold));
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            letter-spacing: 2px;
        }
        @keyframes shimmer { to { background-position: 200%; } }

        .stats-bar {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .stat-pill {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-family: 'Orbitron', monospace;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .stat-pill span { color: white; font-weight: 600; }

        /* Left panel — upgrades */
        .panel-left {
            background: linear-gradient(180deg, rgba(10,10,26,0.97), rgba(15,10,28,0.97));
            border-right: 1px solid var(--border);
            padding: 20px 12px;
            overflow-y: auto;
            height: 100%;
        }
        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--gold);
            opacity: 0.7;
            margin-bottom: 14px;
            padding-left: 6px;
            text-transform: uppercase;
        }

        /* Center */
        .panel-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Score display */
        .score-display {
            text-align: center;
            margin-bottom: 30px;
        }
        .score-main {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 40px rgba(255,215,0,0.6);
            line-height: 1;
            letter-spacing: -1px;
        }
        .score-label {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--gold);
            opacity: 0.6;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .cps-display {
            font-size: 0.8rem;
            color: rgba(255,215,0,0.5);
            margin-top: 6px;
            font-family: 'Orbitron', monospace;
        }

        /* THE COOKIE */
        .cookie-arena {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .cookie-glow-ring {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.1);
            animation: ring-pulse 3s ease-in-out infinite;
        }
        .cookie-glow-ring:nth-child(2) { inset: -40px; animation-delay: 1s; opacity: 0.5; }
        .cookie-glow-ring:nth-child(3) { inset: -60px; animation-delay: 2s; opacity: 0.2; }
        @keyframes ring-pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .cookie-btn {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            cursor: none;
            background: transparent;
            box-shadow: none;
            transition: transform 0.08s ease, filter 0.08s ease;
            overflow: visible;
            z-index: 2;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cookie-btn:active, .cookie-btn.popped {
            transform: scale(0.92);
        }
        .cookie-svg {
            width: 220px;
            height: 220px;
            animation: cookie-wobble 7s ease-in-out infinite;
            filter:
                drop-shadow(0 0 18px rgba(200,130,40,0.55))
                drop-shadow(0 0 40px rgba(160,90,20,0.3));
            pointer-events: none;
            user-select: none;
        }
        @keyframes cookie-wobble {
            0%, 100% { transform: rotate(-2deg) scale(1); }
            30% { transform: rotate(1.5deg) scale(1.025); }
            70% { transform: rotate(-1deg) scale(0.975); }
        }
        .cookie-btn.golden .cookie-svg {
            filter:
                drop-shadow(0 0 30px rgba(255,215,0,0.9))
                drop-shadow(0 0 60px rgba(255,150,0,0.6))
                brightness(1.4) saturate(1.5);
        }

        /* Crumb particles */
        .crumb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 8500;
            animation: crumb-fall var(--dur) ease forwards;
        }
        @keyframes crumb-fall {
            0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.2); opacity: 0; }
        }

        /* Shooting stars */
        .shooting-star {
            position: fixed;
            height: 2px;
            border-radius: 100px;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0), white 60%, rgba(255,220,150,0.6));
            animation: shoot var(--dur) ease forwards;
            transform-origin: right center;
        }
        @keyframes shoot {
            0%   { opacity: 0; transform: translateX(0) scaleX(0.1); }
            10%  { opacity: 1; transform: translateX(0) scaleX(1); }
            100% { opacity: 0; transform: translateX(var(--dist)) scaleX(0.3); }
        }

        /* Floating texts */
        .float-text {
            position: fixed;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255,215,0,0.8);
            pointer-events: none;
            z-index: 9000;
            animation: float-up 1.2s ease forwards;
        }
        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
        }

        /* Combo system */
        .combo-display {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(135deg, #ff4444, #ff8800);
            border-radius: 20px;
            padding: 4px 12px;
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s;
            z-index: 5;
            white-space: nowrap;
        }
        .combo-display.active { opacity: 1; transform: scale(1); }

        /* Shop items */
        .shop-item {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 10px;
            margin-bottom: 8px;
            cursor: none;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .shop-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,215,0,0.03));
            opacity: 0;
            transition: opacity 0.25s;
        }
        .shop-item:hover::before { opacity: 1; }
        .shop-item.affordable {
            border-color: rgba(255,215,0,0.4);
            box-shadow: 0 0 15px rgba(255,215,0,0.1);
        }
        .shop-item.affordable:hover {
            border-color: rgba(255,215,0,0.7);
            box-shadow: 0 0 25px rgba(255,215,0,0.2);
            transform: translateX(3px);
        }
        .shop-item.locked { opacity: 0.35; }
        .shop-item.locked:hover { transform: none; }

        .item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .item-icon { font-size: 1.4rem; }
        .item-name {
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
            flex: 1;
        }
        .item-count {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: var(--gold);
            font-weight: 700;
        }
        .item-desc {
            font-size: 0.68rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .item-price {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .price-tag {
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            color: var(--gold);
        }
        .buy-btn {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.15));
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 6px;
            padding: 3px 10px;
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            color: var(--gold);
            cursor: none;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        .shop-item.affordable .buy-btn:hover {
            background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,107,53,0.3));
            border-color: var(--gold);
        }

        /* Right panel — achievements */
        .panel-right {
            background: linear-gradient(180deg, rgba(10,10,26,0.97), rgba(12,8,22,0.97));
            border-left: 1px solid var(--border);
            padding: 20px 12px;
            overflow-y: auto;
            height: 100%;
        }

        .achievement {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 6px;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: all 0.3s;
            opacity: 0.3;
        }
        .achievement.unlocked {
            opacity: 1;
            border-color: rgba(255,215,0,0.5);
            box-shadow: 0 0 15px rgba(255,215,0,0.1);
            animation: achievement-pop 0.5s ease;
        }
        @keyframes achievement-pop {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .achievement-icon { font-size: 1.5rem; }
        .achievement-info { flex: 1; }
        .achievement-name {
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .achievement-desc { font-size: 0.63rem; color: rgba(255,255,255,0.4); margin-top: 2px; }

        /* Notifications */
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, rgba(15,10,30,0.98), rgba(25,15,40,0.98));
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 14px 18px;
            max-width: 300px;
            z-index: 8000;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
            animation: notif-in 0.4s ease, notif-out 0.4s ease 2.6s forwards;
        }
        @keyframes notif-in { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes notif-out { to { opacity: 0; transform: translateX(30px); } }
        .notif-title { font-family: 'Orbitron', monospace; font-size: 0.65rem; color: var(--gold); letter-spacing: 2px; margin-bottom: 4px; }
        .notif-msg { font-size: 0.75rem; color: rgba(255,255,255,0.8); }

        /* Progress bar */
        .progress-section { margin-bottom: 20px; text-align: center; }
        .progress-label { font-size: 0.65rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; margin-bottom: 6px; font-family: 'Orbitron', monospace; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius: 2px; transition: width 0.5s ease; }

        /* Milestones */
        .milestone-text {
            font-size: 0.7rem;
            color: rgba(255,215,0,0.5);
            text-align: center;
            margin-top: 8px;
            font-family: 'Orbitron', monospace;
        }

        /* Prestige button */
        .prestige-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(138,43,226,0.2), rgba(75,0,130,0.2));
            border: 1px solid rgba(138,43,226,0.4);
            border-radius: 8px;
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            color: #bf7fff;
            cursor: none;
            letter-spacing: 1px;
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        .prestige-btn.visible { opacity: 1; pointer-events: auto; }
        .prestige-btn.visible:hover {
            background: linear-gradient(135deg, rgba(138,43,226,0.4), rgba(75,0,130,0.4));
            border-color: rgba(138,43,226,0.7);
            box-shadow: 0 0 20px rgba(138,43,226,0.3);
        }

        /* Prestige overlay */
        .prestige-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(138,43,226,0.8), rgba(0,0,0,0.95));
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }
        .prestige-overlay.active { opacity: 1; pointer-events: auto; }
        .prestige-big { font-family: 'Orbitron', monospace; font-size: 4rem; font-weight: 900; color: white; text-shadow: 0 0 60px rgba(138,43,226,0.8); }
        .prestige-sub { font-size: 1rem; color: rgba(255,255,255,0.6); margin: 20px 0 40px; letter-spacing: 4px; text-transform: uppercase; }
        .prestige-level-badge {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            color: #bf7fff;
            border: 2px solid rgba(138,43,226,0.5);
            border-radius: 50px;
            padding: 10px 30px;
            margin-bottom: 30px;
        }

        /* Cookie particles on prestige */
        @keyframes prestige-particle {
            from { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
            to { transform: translate(var(--tx), var(--ty)) rotate(720deg) scale(0); opacity: 0; }
        }

        /* Multiplier display */
        .multiplier-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(138,43,226,0.3), rgba(75,0,130,0.3));
            border: 1px solid rgba(138,43,226,0.5);
            border-radius: 12px;
            padding: 3px 10px;
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            color: #bf7fff;
            margin-left: 8px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.2); border-radius: 2px; }

        /* Mobile */
        @media (max-width: 900px) {
            .game-wrapper { grid-template-columns: 1fr; grid-template-rows: auto; }
            .panel-left, .panel-right { max-height: 300px; border: none; border-top: 1px solid var(--border); }

            .panel-center {
                max-width: 73%;
            }

            .panel-left {
                padding: 30px 0px;
            }
        }

        /* Secret cookie animation */
        @keyframes golden-flash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2) saturate(2) hue-rotate(30deg); }
        }
        .cookie-btn.golden { animation: golden-flash 0.3s ease; }

        /* Level up flash */
        .level-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(255,215,0,0.15), transparent 70%);
            pointer-events: none;
            z-index: 7000;
            opacity: 0;
            animation: flash-out 0.8s ease forwards;
        }
        @keyframes flash-out { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
<div id="cursor"></div>
<div id="stars"></div>

<div class="prestige-overlay" id="prestigeOverlay">
    <div class="prestige-big">✨ PRESTIGE ✨</div>
    <div class="prestige-sub">L'univers se réinitialise</div>
    <div class="prestige-level-badge" id="prestigeBadge">Niveau ★ 1</div>
    <p style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin-bottom:30px;">+50% de bonus permanents pour toujours</p>
    <button onclick="confirmPrestige()" style="background:linear-gradient(135deg,#6a0dad,#8b00ff);border:none;border-radius:10px;padding:14px 40px;font-family:'Orbitron',monospace;font-size:0.8rem;color:white;cursor:pointer;letter-spacing:2px;box-shadow:0 0 40px rgba(138,43,226,0.6);">TRANSCENDER</button>
</div>

<div class="game-wrapper">
    <!-- HEADER -->
    <header>
        <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">🍪 GALACTIC COOKIE</a></div>
        <div class="stats-bar">
            <div class="stat-pill">CPS: <span id="cpsHeader">0</span></div>
            <div class="stat-pill">TOTAL: <span id="totalHeader">0</span></div>
            <div class="stat-pill">PRESTIGE: <span id="prestigeHeader">★0</span></div>
        </div>
    </header>

    <!-- LEFT PANEL: SHOP -->
    <div class="panel-left" id="shopPanel">
        <div class="panel-title">Boutique Galactique</div>
        <div id="shopItems"></div>
        <button class="prestige-btn" id="prestigeBtn" onclick="startPrestige()">⚡ PRESTIGE — Transcender</button>
    </div>

    <!-- CENTER: COOKIE -->
    <div class="panel-center">
        <div class="score-display">
            <div class="score-main" id="scoreDisplay">0</div>
            <div class="score-label">Biscuits Cosmiques</div>
            <div class="cps-display" id="cpsDisplay">+0 / seconde</div>
        </div>

        <div class="progress-section">
            <div class="progress-label" id="progressLabel">PROCHAIN PALIER</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <div class="milestone-text" id="milestoneText">🎯 100 biscuits</div>
        </div>

        <div class="cookie-arena">
            <div class="cookie-glow-ring"></div>
            <div class="cookie-glow-ring"></div>
            <div class="cookie-glow-ring"></div>
            <div class="combo-display" id="comboDisplay">🔥 COMBO ×1</div>
            <button class="cookie-btn" id="cookieBtn" onclick="clickCookie(event)">
                <svg class="cookie-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="cookieBase" cx="38%" cy="32%" r="65%">
                      <stop offset="0%"   stop-color="#e8a050"/>
                      <stop offset="35%"  stop-color="#c07828"/>
                      <stop offset="70%"  stop-color="#955010"/>
                      <stop offset="100%" stop-color="#6a3208"/>
                    </radialGradient>
                    <radialGradient id="cookieShine" cx="30%" cy="25%" r="45%">
                      <stop offset="0%"  stop-color="rgba(255,220,160,0.35)"/>
                      <stop offset="100%" stop-color="rgba(255,220,160,0)"/>
                    </radialGradient>
                    <radialGradient id="chip1" cx="40%" cy="30%" r="60%">
                      <stop offset="0%" stop-color="#5a2e08"/>
                      <stop offset="100%" stop-color="#2e1204"/>
                    </radialGradient>
                    <filter id="crunchShadow" x="-10%" y="-10%" width="120%" height="120%">
                      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(40,15,0,0.5)"/>
                    </filter>
                  </defs>

                  <!-- Main cookie disc -->
                  <circle cx="110" cy="112" r="99" fill="url(#cookieBase)" filter="url(#crunchShadow)"/>

                  <!-- Edge texture — slightly darker ring -->
                  <circle cx="110" cy="112" r="99" fill="none" stroke="rgba(80,35,5,0.45)" stroke-width="7"/>

                  <!-- Subtle crack lines -->
                  <path d="M110,30 Q118,60 115,90 Q112,115 120,140" stroke="rgba(70,28,4,0.35)" stroke-width="2" fill="none" stroke-linecap="round"/>
                  <path d="M55,65 Q80,80 95,100 Q105,118 90,145" stroke="rgba(70,28,4,0.28)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                  <path d="M150,70 Q138,92 145,115 Q152,135 140,158" stroke="rgba(70,28,4,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

                  <!-- Chocolate chips — varied sizes & shapes -->

// ==================== GAME STATE ====================

// ==================== BUILDINGS ====================

// ==================== SAVE / LOAD (cookies 🍪) ====================

function saveGame() {
    const data = {
        score:               state.score,
        totalEarned:         state.totalEarned,
        prestige:            state.prestige,
        clickPower:          state.clickPower,
        prestigeBonus:       state.prestigeBonus,
        buildings:           state.buildings.map(b => ({ id: b.id, count: b.count })),
        upgrades:            CLICK_UPGRADES.map(u => ({ id: u.id, bought: u.bought })),
        achievements:        [...state.unlockedAchievements],
        savedAt:             Date.now(),
        cps: state.cps,
        prestigeBonus: state.prestigeBonus,
    };

    // Cookie
    try {
        const encoded = btoa(JSON.stringify(data));
        document.cookie = `${SAVE_KEY}=${encoded}; max-age=31536000; path=/; SameSite=Lax`;
    } catch(e) {}

    // LocalStorage (principal)
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch(e) {}
}

function loadGame() {
    let data = null;

    // localStorage en priorité
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) data = JSON.parse(raw);
    } catch(e) {}

    // fallback cookie
    if (!data) {
        try {
            const match = document.cookie.match(new RegExp(`${SAVE_KEY}=([^;]+)`));
            if (match) data = JSON.parse(atob(match[1]));
        } catch(e) {}
    }

    if (!data) return false;

    state.score          = data.score ?? 0;
    state.totalEarned    = data.totalEarned ?? 0;
    state.prestige       = data.prestige ?? 0;
    state.clickPower     = data.clickPower ?? 1;
    state.prestigeBonus  = data.prestigeBonus ?? 1;

    (data.buildings || []).forEach(saved => {
        const b = state.buildings.find(x => x.id === saved.id);
        if (b) b.count = saved.count || 0;
    });

    state.clickPower = 1;
    (data.upgrades || []).forEach(saved => {
        const u = CLICK_UPGRADES.find(x => x.id === saved.id);
        if (u && saved.bought) {
            u.bought = true;
            state.clickPower *= u.multiplier;
        }
    });

    state.unlockedAchievements = new Set(data.achievements || []);

    if (data.savedAt) {
        calcCps();
        const elapsed = Math.min((Date.now() - data.savedAt) / 1000, 3600);
        const offline = elapsed * state.cps * state.prestigeBonus;

        if (offline > 0) {
            state.score += offline;
            state.totalEarned += offline;
            setTimeout(
                () => showNotification(
                    '💤 Revenus hors-ligne',
                    `+${fmt(offline)} biscuits pendant ${Math.floor(elapsed)}s`
                ),
                800
            );
        }
    }

    return true;
}

function startAutosave() {
    // Save every 10 seconds
    setInterval(saveGame, 10000);
    // Also save on page close
    window.addEventListener('beforeunload', saveGame);
}

// ==================== INIT ====================
function init() {
    // Clone buildings into state
    state.buildings = BUILDINGS.map(b => ({ ...b }));
    state.clickMultiplier = 1;
    state.prestigeBonus = 1;

    const hadSave = loadGame();

    renderShop();

// ==================== CURSOR ====================
function setupCursor() {
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });
    document.addEventListener('mousedown', () => cursor.classList.add('clicking'));
    document.addEventListener('mouseup', () => cursor.classList.remove('clicking'));
}

// ==================== CLICKS PER SECOND ====================
const clickTimestamps = [];

function recordClick() {
    const now = Date.now();
    clickTimestamps.push(now);
    // Keep only last 2 seconds of history
    while (clickTimestamps.length && clickTimestamps[0] < now - 1000) {
        clickTimestamps.shift();
    }
}

function getClicksPerSecond() {
    const now = Date.now();
    return clickTimestamps.filter(t => t >= now - 1000).length;
}

// ==================== FORMAT NUMBER ====================
function fmt(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'G';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
    return Math.floor(n).toString();
}

// ==================== CLICK ====================
function clickCookie(event) {
    recordClick();
    const now = Date.now();
    const timeDiff = now - state.lastClickTime;

    // Combo system
    if (timeDiff < 600) {
        state.combo = Math.min(state.combo + 1, 20);
    } else {
        state.combo = 1;
    }
    state.lastClickTime = now;

    // Reset combo timer
    clearTimeout(state.comboTimer);
    state.comboTimer = setTimeout(() => {
        state.combo = 0;
        updateComboDisplay();
    }, 2000);

    updateComboDisplay();

    // Calculate points
    const baseClick = state.clickPower;
    const comboMult = state.combo >= 5 ? (1 + (state.combo - 4) * 0.2) : 1;
    const points = Math.ceil(baseClick * comboMult * state.prestigeBonus);

    state.score += points;
    state.totalEarned += points;

    // Float text
    spawnFloatText(event.clientX, event.clientY, '+' + fmt(points));
    spawnCrumbs(event.clientX, event.clientY);

    // Cookie pop animation
    const btn = document.getElementById('cookieBtn');
    btn.classList.add('popped');
    setTimeout(() => btn.classList.remove('popped'), 80);

    // Special golden flash every 100 clicks
    if (Math.random() < 0.02) {
        btn.classList.add('golden');
        const bonus = points * 50;
        state.score += bonus;
        state.totalEarned += bonus;
        spawnFloatText(event.clientX, event.clientY - 40, '✨ GOLDEN +' + fmt(bonus), '#FFD700', '1.4rem');
        setTimeout(() => btn.classList.remove('golden'), 400);
    }

    updateUI();
    checkAchievements();
}

function updateComboDisplay() {
    const el = document.getElementById('comboDisplay');
    if (state.combo >= 2) {
        el.textContent = `🔥 COMBO ×${state.combo}`;
        el.classList.add('active');
        el.style.background = state.combo >= 10
            ? 'linear-gradient(135deg, #ff00ff, #8800ff)'
            : 'linear-gradient(135deg, #ff4444, #ff8800)';
    } else {
        el.classList.remove('active');
    }
}

// ==================== FLOAT TEXT ====================
function spawnFloatText(x, y, text, color = '#FFD700', size = '1.1rem') {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.style.left = (x - 20) + 'px';
    el.style.top = (y - 20) + 'px';
    el.style.color = color;
    el.style.fontSize = size;
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
}

// ==================== SMOOTH SCORE RENDERING ====================
let displayedScore = 0;

function smoothRender() {
    // Interpolate displayed score toward real score
    const diff = state.score - displayedScore;
    if (Math.abs(diff) < 0.5) {
        displayedScore = state.score;
    } else {
        displayedScore += diff * 0.12;
    }

    document.getElementById('scoreDisplay').textContent = fmt(Math.floor(displayedScore));

    // Also smoothly update CPS header (just real value, no interpolation needed)
    const realCps = state.cps * state.prestigeBonus;
    document.getElementById('cpsDisplay').textContent = `+${fmt(realCps)} / seconde`;
    document.getElementById('cpsHeader').textContent = fmt(realCps);

    document.getElementById('clicksPerSecDisplay').textContent = getClicksPerSecond();

    requestAnimationFrame(smoothRender);
}

// ==================== CRUMB PARTICLES ====================
const CRUMB_COLORS = ['#e8a050','#c07828','#955010','#d4884a','#7a400e','#f0b870','#5a2e08'];

function spawnCrumbs(x, y) {
    const count = 6 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'crumb';
        const size = 4 + Math.random() * 8;
        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 90;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist + 30 + Math.random() * 40;
        const dur = 0.5 + Math.random() * 0.5;
        const color = CRUMB_COLORS[Math.floor(Math.random() * CRUMB_COLORS.length)];
        // Some crumbs are tiny squares (chips)
        const isChip = Math.random() < 0.25;
        el.style.cssText = `
            left: ${x - size/2}px;
            top: ${y - size/2}px;
            width: ${size}px;
            height: ${size}px;
            background: ${color};
            border-radius: ${isChip ? '2px' : '50%'};
            --tx: ${tx}px;
            --ty: ${ty}px;
            --rot: ${Math.random() * 720 - 360}deg;
            --dur: ${dur}s;
            box-shadow: 0 0 ${isChip ? 4 : 2}px rgba(0,0,0,0.4);
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), dur * 1000 + 50);
    }
}

// ==================== SHOOTING STARS ====================
function spawnShootingStar() {
    const el = document.createElement('div');
    el.className = 'shooting-star';
    // Random position in upper 70% of screen
    const startX = Math.random() * window.innerWidth * 0.6 + window.innerWidth * 0.1;
    const startY = Math.random() * window.innerHeight * 0.6 + 30;
    // Always travels top-right to bottom-left or top-left to bottom-right
    const goRight = Math.random() < 0.5;
    const length = 120 + Math.random() * 180;
    const angle = (goRight ? 1 : -1) * (15 + Math.random() * 20);
    const dist = -(200 + Math.random() * 300);
    const dur = 0.9 + Math.random() * 0.6;

    el.style.cssText = `
        left: ${startX}px;
        top: ${startY}px;
        width: ${length}px;
        transform: rotate(${angle}deg);
        --dist: ${goRight ? dist : -dist}px;
        --dur: ${dur}s;
        opacity: 0;
    `;
    document.getElementById('stars').appendChild(el);
    setTimeout(() => el.remove(), (dur + 0.1) * 1000);
}

function startShootingStars() {
    // Fire 1-2 stars every ~10 seconds, with slight jitter
    function schedule() {
        const delay = 8000 + Math.random() * 5000; // 8-13s
        setTimeout(() => {
            spawnShootingStar();
            // Occasionally fire a second one shortly after
            if (Math.random() < 0.35) {
                setTimeout(spawnShootingStar, 300 + Math.random() * 400);
            }
            schedule();
        }, delay);
    }
    // First one after 4-8s
    setTimeout(() => { spawnShootingStar(); schedule(); }, 4000 + Math.random() * 4000);
}

// ==================== AUTO TICK ====================
function startAutoTick() {
    setInterval(() => {
        const earned = state.cps / 20 * state.prestigeBonus;
        if (earned > 0) {
            state.score += earned;
            state.totalEarned += earned;
        }
        updateUI();
        checkAchievements();
    }, 50);
}

// ==================== CALCULATE CPS ====================
function calcCps() {
    let cps = 0;
    state.buildings.forEach(b => {
        cps += b.baseCps * b.count;
    });
    state.cps = cps;
    return cps;
}

// ==================== BUILDING PRICE ====================
function buildingPrice(b) {
    return Math.ceil(b.basePrice * Math.pow(1.15, b.count));
}

// ==================== BUY BUILDING ====================
function buyBuilding(id) {
    const b = state.buildings.find(x => x.id === id);
    if (!b) return;
    const price = buildingPrice(b);
    if (state.score < price) return;
    state.score -= price;
    b.count++;
    calcCps();
    renderShop();
    showNotification('🏗️ Acheté!', `${b.icon} ${b.name} ×${b.count}`);
    flashLevel();
    checkAchievements();
    updateUI();
}

// ==================== BUY CLICK UPGRADE ====================
function buyClickUpgrade(id) {
    const u = CLICK_UPGRADES.find(x => x.id === id);
    if (!u || u.bought) return;
    if (state.score < u.price) return;
    state.score -= u.price;
    u.bought = true;
    state.clickPower *= u.multiplier;
    renderShop();
    showNotification('⚡ Amélioré!', `${u.icon} ${u.name} (×${u.multiplier})`);
    updateUI();
}

// ==================== RENDER SHOP ====================
function renderShop() {
    const container = document.getElementById('shopItems');
    let html = '<div class="panel-title" style="margin-top:0">Améliorations de clic</div>';

    // Click upgrades
    CLICK_UPGRADES.forEach(u => {
        if (u.bought) return;
        const affordable = state.score >= u.price;
        html += `
            <div class="shop-item ${affordable ? 'affordable' : ''}" onclick="buyClickUpgrade('${u.id}')">
                <div class="item-header">
                    <span class="item-icon">${u.icon}</span>
                    <span class="item-name">${u.name}</span>
                </div>
                <div class="item-desc">${u.desc}</div>
                <div class="item-price">
                    <span class="price-tag">🍪 ${fmt(u.price)}</span>
                    <button class="buy-btn">ACHETER</button>
                </div>
            </div>`;
    });

    html += '<div class="panel-title" style="margin-top:14px">Bâtiments</div>';

    // Buildings
    state.buildings.forEach(b => {
        const price = buildingPrice(b);
        const affordable = state.score >= price;
        html += `
            <div class="shop-item ${affordable ? 'affordable' : ''}" onclick="buyBuilding('${b.id}')">
                <div class="item-header">
                    <span class="item-icon">${b.icon}</span>
                    <span class="item-name">${b.name}</span>
                    <span class="item-count">${b.count}</span>
                </div>
                <div class="item-desc">${b.desc} (+${b.baseCps}/s chacun)</div>
                <div class="item-price">
                    <span class="price-tag">🍪 ${fmt(price)}</span>
                    <button class="buy-btn">ACHETER</button>
                </div>
            </div>`;
    });

    container.innerHTML = html;

    // Prestige button
    const pb = document.getElementById('prestigeBtn');
    const prestigeCost = getPrestigeCost();

    if (state.totalEarned >= prestigeCost) {
        pb.classList.add('visible');
        pb.textContent =
            `⚡ PRESTIGE ★${state.prestige + 1} — Transcender (${fmt(prestigeCost)} requis)`;
    } else {
        pb.classList.remove('visible');
    }
}

// ==================== RENDER ACHIEVEMENTS ====================
function renderAchievements() {
    const container = document.getElementById('achievementsList');
    let html = '';
    ACHIEVEMENTS_DEF.forEach(a => {
        const unlocked = state.unlockedAchievements.has(a.id);
        html += `
            <div class="achievement ${unlocked ? 'unlocked' : ''}" id="ach_${a.id}">
                <div class="achievement-icon">${a.icon}</div>
                <div class="achievement-info">
                    <div class="achievement-name">${a.name}</div>
                    <div class="achievement-desc">${unlocked ? a.desc : '???'}</div>
                </div>
            </div>`;
    });
    container.innerHTML = html;
}

// ==================== CHECK ACHIEVEMENTS ====================
function checkAchievements() {
    ACHIEVEMENTS_DEF.forEach(a => {
        if (!state.unlockedAchievements.has(a.id) && a.condition(state)) {
            state.unlockedAchievements.add(a.id);
            document.getElementById(`ach_${a.id}`)?.classList.add('unlocked');
            document.querySelector(`#ach_${a.id} .achievement-desc`).textContent = a.desc;
            showNotification(`🏅 TROPHÉE DÉBLOQUÉ`, `${a.icon} ${a.name}`);
        }
    });
}

// ==================== UPDATE UI ====================
function updateUI() {
    calcCps();

    document.getElementById('totalHeader').textContent = fmt(state.totalEarned);
    document.getElementById('prestigeHeader').textContent = '★' + state.prestige;

    // Prestige display
    if (state.prestige > 0) {
        document.getElementById('prestigeMultiplierDisplay').style.display = 'inline-block';
        document.getElementById('pmValue').textContent = state.prestigeBonus.toFixed(1);
    }

    // Progress bar
    let nextMilestone = MILESTONES.find(m => m > state.totalEarned) || MILESTONES[MILESTONES.length - 1] * 10;
    let prevMilestone = [...MILESTONES].reverse().find(m => m <= state.totalEarned) || 0;
    const progress = Math.min(100, ((state.totalEarned - prevMilestone) / (nextMilestone - prevMilestone)) * 100);
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('milestoneText').textContent = `🎯 ${fmt(nextMilestone)} biscuits`;
}

// ==================== PRESTIGE ====================
function startPrestige() {
    if (state.totalEarned < 500000) return;
    document.getElementById('prestigeOverlay').classList.add('active');
    document.getElementById('prestigeBadge').textContent = `Niveau ★ ${state.prestige + 1}`;
}

function confirmPrestige() {
    state.prestige++;
    state.prestigeBonus = 1 + state.prestige * 0.5;
    state.score = 0;
    state.totalEarned = 0;
    state.clickPower = 1;
    state.combo = 0;
    state.buildings = BUILDINGS.map(b => ({ ...b }));
    CLICK_UPGRADES.forEach(u => u.bought = false);
    document.getElementById('prestigeOverlay').classList.remove('active');
    renderShop();
    updateUI();
    showNotification('✨ PRESTIGE!', `Bonus permanent: ×${state.prestigeBonus}`);
    flashLevel();
    checkAchievements();
    saveGame();
}

// ==================== NOTIFICATIONS ====================
function showNotification(title, msg) {
    const el = document.createElement('div');
    el.className = 'notification';
    el.innerHTML = `<div class="notif-title">${title}</div><div class="notif-msg">${msg}</div>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

// ==================== FLASH ====================
function flashLevel() {
    const el = document.createElement('div');
    el.className = 'level-flash';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

// ==================== START ====================
init();
smoothRender();
</script>
</body>
</html>
